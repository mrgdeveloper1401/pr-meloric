services:
  app:
    container_name: music_app
    ports:
      - "3000:3000"
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - 3000
    env_file: ".env"
    restart: always
    depends_on:
      - db
      - redis
  
  db:
    container_name: music_db
    ports:
      - "5432:5432"
    expose:
      - 5432
    volumes:
      - music_volume:/var/lib/postgresql/data
    image: docker.arvancloud.ir/postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_PASSWORD=${PROD_POSTGRES_PASSWORD}
      - POSTGRES_USER=${PROD_POSTGRES_USER}
      - POSTGRES_DB=${PROD_POSTGRES_DB}
      - shared_preload_libraries=pg_stat_statements
      - pg_stat_statements.track=all

  redis:
    volumes:
      - redis_data:/data
    container_name: music_db_redis
    image: docker.arvancloud.ir/redis:8.2-alpine
    restart: always
    expose:
      - 6379

  nginx:
    container_name: music_nginx
    volumes:
      - static_files:/var/www/static/
    ports:
      - "80:80"
      - "443:443"
    restart: always
    build:
      context: nginx
      dockerfile: Dockerfile

  dj-admin-pannel:
    build:
      context: /root/online-melo
      dockerfile: Dockerfile
    env_file: "/root/online-melo/.env"
    restart: always
    expose:
      - 8000
    ports:
      - "8000:8000"
    volumes:
      - static_files:/home/app/staticfiles
    depends_on:
      - db
      - app
      - redis
      - nginx

  pghero:
    container_name: music_pghero
    volumes:
     - ./pghero.yml:/app/config/pghero.yml
    depends_on:
     - db
    restart: always
    image: docker.arvancloud.ir/ankane/pghero
    ports:
      - "8080:8080"
    expose:
     - 8080
    # environment:
    #   - PGHERO_USERNAME=${PGHERO_USERNAME}
    #   - PGHERO_PASSWORD=${PGHERO_PASSWORD}
    #  - DATABASE_URL=${PG_HERO_DATABASE_URL}

volumes:
  music_volume:
  static_files:
  redis_data:
