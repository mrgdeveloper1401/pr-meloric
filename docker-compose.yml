services:
  db:
    container_name: music_db
    ports:
      - "5432:5432"
    expose:
      - 5432
    volumes:
      - music_volume:/var/lib/postgresql/data
    image: docker.arvancloud.ir/postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_PASSWORD=${PROD_POSTGRES_PASSWORD}
      - POSTGRES_USER=${PROD_POSTGRES_USER}
      - POSTGRES_DB=${PROD_POSTGRES_DB}
      - shared_preload_libraries=pg_stat_statements
      - pg_stat_statements.track=all

  redis:
    volumes:
      - redis_data:/data
    container_name: music_db_redis
    image: docker.arvancloud.ir/redis:8.2-alpine
    restart: always
    expose:
      - 6379

  app:
    container_name: music_app
    ports:
      - "3000:3000"
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - 3000
    env_file: ".env"
    restart: always

  # pgadmin:
  #   depends_on:
  #     - db
  #   container_name: pgadmin_music
  #   image: dpage/pgadmin4
  #   restart: always
  #   env_file: "pgadmin.env"
  #   ports:
  #     - "8081:80"
  #   environment:
  #    - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
  #    - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin

  nginx:
    container_name: music_nginx
    volumes:
      - static_files:/var/www/static/
      - log_nginx:/var/log/nginx
      - /root/nginx/certbot:/etc/letsencrypt:ro
      # - log_rotate:/var/log/rotate/nginx
    ports:
      - "80:80"
      - "443:443"
    restart: always
    build:
      context: nginx
      dockerfile: Dockerfile
    depends_on:
      - app
      # - pgadmin

volumes:
  music_volume:
  static_files:
  redis_data:
  log_nginx:
  pgadmin_data:
  # log_rotate:
