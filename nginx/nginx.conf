user nginx;
worker_processes auto;

pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 16M;
    client_body_buffer_size 256k;
    proxy_read_timeout 30;
    proxy_request_buffering on;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    # path route log
    access_log /var/log/nginx/general_access.log main;
    error_log /var/log/nginx/general_error.log warn;

    sendfile on;

    # Redirect HTTP to HTTPS for all domains
    server {
        listen 80;
        server_name api.meloricdns.com;
        return 301 https://$host$request_uri;
    }

    # node api
    server {
        listen 443 ssl;
        server_name api.meloricdns.com;
        http2 on;

        # log node js
        access_log /var/log/nginx/api_access.log main;
        error_log /var/log/nginx/api_error.log warn;

        ssl_certificate /certbot/api.meloricdns.com/fullchain1.pem;
        ssl_certificate_key /certbot/api.meloricdns.com/privkey1.pem;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://music_app:3000;
        }
    }

    # Admin panel subdomain - Django Admin
    server {
        listen 443 ssl;
        server_name pannel.meloricdns.com;
        http2 on;

        ssl_certificate /certbot/api.meloricdns.com/fullchain1.pem;
        ssl_certificate_key /certbot/api.meloricdns.com/privkey1.pem;

        # log admin pannel
        access_log /var/log/nginx/pannel_access.log main;
        error_log /var/log/nginx/pannel_error.log warn;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://dj-admin-pannel:8000;
        }
    }

    server {
        listen 443 ssl;
        server_name pghero.meloricdns.com;
        http2 on;

        ssl_certificate /certbot/api.meloricdns.com/fullchain1.pem;
        ssl_certificate_key /certbot/api.meloricdns.com/privkey1.pem;

        # log pghero
        access_log /var/log/nginx/pghero_access.log main;
        error_log /var/log/nginx/pghero_error.log warn;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://pghero:8080;
        }
    }

    # flower
    server {
        listen 443 ssl;
        server_name flower.meloricdns.com;
        http2 on;

        ssl_certificate /certbot/api.meloricdns.com/fullchain1.pem;
        ssl_certificate_key /certbot/api.meloricdns.com/privkey1.pem;

        # log flower
        access_log /var/log/nginx/flower_access.log main;
        error_log /var/log/nginx/flower_error.log warn;

        location /static/ {
            alias /var/www/static/flower/;
            gzip on;
        }

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://flower:5555;
        }

    }

    # pgadmin
    server {
        listen 443 ssl;
        server_name pgadmin.meloricdns.com;
        http2 on;

        access_log /var/log/nginx/pgadmin_access.log;
        error_log /var/log/nginx/pgadmin_error.log;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://pgadmin_music:80;
        }
    };
}
