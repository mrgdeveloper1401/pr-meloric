user nginx;
worker_processes auto;

pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    client_max_body_size 25M;
    client_body_buffer_size 256k;
    proxy_read_timeout 30;
    proxy_request_buffering on;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Timeouts - 🆕 بهینه‌سازی
    client_body_timeout 120;
    client_header_timeout 120;
    send_timeout 10;

    # 🆕 تنظیمات buffer
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    proxy_read_timeout 30;
    proxy_request_buffering on;

    # basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    # path route log
    access_log /var/log/nginx/general_access.log main buffer=32k flush=30s;
    error_log /var/log/nginx/general_error.log warn buffer=32k flush=30s;

    # Performance Optimizations
    sendfile on; # send file on disk into network / سیستم ارسال فایل
    tcp_nopush on; # send packet when buffer is full / بهینه‌سازی برای فایل‌های بزرگ
    tcp_nodelay on; # send data without wait full buffer memory / بهینه‌سازی برای داده‌های کوچک

    # 🆕 بهبود keepalive
    keepalive_timeout 120; # open connection tcp
    types_hash_max_size 2048; # مدیریت hash table
    keepalive_requests 1000; # 🆕 تعداد درخواست در هر connection

    # compressor
    gzip on;
    gzip_types
        # انواع پایه متنی
        text/plain
        text/css
        text/xml
        text/javascript
        text/html
        text/markdown
        text/csv

        # JSON APIs - برای DRF و drf-spectacular
        application/json
        application/ld+json
        application/vnd.api+json
        application/openapi+json
        application/swagger+json
        application/schema+json

        # JavaScript - برای Django Admin و static files
        application/javascript
        application/x-javascript

        # XML و feeds
        application/xml
        application/xml+rss
        application/atom+xml
        application/rss+xml

        # Django Admin و HTML
        application/xhtml+xml

        # فونت‌ها - برای Whitenoise و static files
        font/woff
        font/woff2
        font/ttf
        font/otf
        application/font-woff
        application/font-woff2
        application/x-font-ttf
        application/vnd.ms-fontobject

        # برای drf-spectacular-sidecar (Swagger UI)
        application/manifest+json
        application/webmanifest+json

        # سایر انواع
        application/yaml
        text/yaml
        application/x-yaml
        text/vtt
        application/vnd.ms-excel;

    
    gzip_min_length 1000; # فقط فایل‌های بزرگ‌تر از 1KB فشرده شوند
    gzip_comp_level 6; # level compressor
    gzip_vary on;
    gzip_proxied any;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;

    # Redirect HTTP to HTTPS for all domains
    server {
        listen 80;
        server_name api.meloricdns.com;
        return 301 https://$host$request_uri;
    }

    # node api
    server {
        server_name api.meloricdns.com;
        listen 443 ssl quic reuseport;
        listen 443 ssl;
        http3 on;
        http2 on;

        ssl_certificate /etc/letsencrypt/api.meloricdns.com/fullchain1.pem;
        ssl_certificate_key /etc/letsencrypt/api.meloricdns.com/privkey1.pem;
        ssl_buffer_size 4k;
        ssl_ecdh_curve X25519:secp384r1:prime256v1;  # 🆕 بهبود performance S
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        # options-ssl-nginx
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

        add_header Alt-Svc 'h3=":443"; ma=86400, h3-29=":443"; ma=86400' always;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Scheme $scheme;
            proxy_pass http://music_app:3000;

            # 🆕 بهبود timeoutها
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # 🆕 بهبود buffering
            proxy_buffers 8 16k;
            proxy_buffer_size 4k;
        }
    }

