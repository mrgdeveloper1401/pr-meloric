/var/log/nginx/*.log {
    daily
    rotate 30
    missingok
    compress
    delaycompress
    notifempty
    sharedscripts
    create 0640 nginx adm

    prerotate
        TODAY_DIR="/var/log/nginx/$(date +%Y)/$(date +%m)/$(date +%d)"
        mkdir -p "$TODAY_DIR"
    endscript

    postrotate
        # این خط حتما باید فعال باشه
        if [ -f /var/run/nginx.pid ]; then
            kill -USR1 $(cat /var/run/nginx.pid)
        fi

        # بعد از reload، لاگ‌ها بسته می‌شن و جدید ساخته می‌شن
        TODAY_DIR="/var/log/nginx/$(date +%Y)/$(date +%m)/$(date +%d)"
        sleep 1  # صبر کوتاه برای باز شدن فایل‌های جدید
        for file in /var/log/nginx/*.log; do
            # فقط لاگ‌های قدیمی رو منتقل کن (یعنی .1 و غیره)
            if [ -f "$file.1" ]; then
                mv "$file.1" "$TODAY_DIR/$(basename "$file")"
            fi
        done
    endscript
}
